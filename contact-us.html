
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .contact-page{max-width:750px;margin:50px auto;padding:25px;color:#173d4e}
    .contact-page h1,.contact-page h2{color:#123e52}
    .contact-page p{line-height:1.7}
    .contact-form{display:grid;gap:15px;margin-top:25px}
    .contact-form label{font-weight:600}
    .contact-form input,.contact-form textarea,.contact-form select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d4e0e8;border-radius:7px;font:inherit}
    .contact-form button{padding:14px;background:#075473;color:#fff;border:0;border-radius:7px;font-size:16px;cursor:pointer}
    .contact-form button:hover{background:#123e52}
    .contact-page a{color:#075473}
    .form-note{font-size:14px;color:#556f7e}
    @media(max-width:600px){.contact-page{margin:20px auto;padding:18px}}
  </style>
</head>
<body>
  <main class="contact-page">
    <h1>Contact Us</h1>
    <p>Have a question about printer setup or the information on our website? Send us a message using the form below.</p>

    <h2>Send a Message</h2>

    <form class="contact-form" action="#" method="post" id="contactForm">
      <div>
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div>
        <label for="model">Printer Model (Optional)</label>
        <input type="text" id="model" name="printer_model" placeholder="Enter your printer model">
      </div>

      <div>
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="">Select a subject</option>
          <option value="setup">Printer Setup</option>
          <option value="connectivity">Connection Issue</option>
          <option value="drivers">Driver Compatibility</option>
          <option value="refund">Refund Inquiry</option>
          <option value="privacy">Privacy Inquiry</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div>
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Send Message</button>
      <p class="form-note">Please do not include passwords, Wi-Fi credentials, or payment-card details.</p>
      <p id="formMessage" aria-live="polite"></p>
    </form>

    <p><a href="index.html">Back to Printer Setup</a></p>
  </main>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("formMessage").textContent =
        "This contact form is not connected to a message service yet. Please configure a form endpoint before accepting submissions.";
    });
  </script>
</body>
</html>
